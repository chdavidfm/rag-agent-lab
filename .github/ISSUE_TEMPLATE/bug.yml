name: Bug report
description: Something does not behave as it should
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happens
      description: What you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce
      placeholder: |
        1. Run `rag-agent --ask "..."`
        2. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.5.0, or the exact commit"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Retrieval backend
      options: [tfidf, embeddings, hybrid, not applicable]
    validations:
      required: true
