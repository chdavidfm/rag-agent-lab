name: Informe de error
description: Algo no funciona como debería
labels: ["error"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Qué ocurre
      description: Qué esperabas y qué ha pasado en su lugar.
    validations:
      required: true
  - type: textarea
    id: reproducir
    attributes:
      label: Cómo reproducirlo
      placeholder: |
        1. Ejecuto `rag-agent --ask "..."`
        2. Observo ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: "0.4.0 o el commit exacto"
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend de recuperación
      options: [tfidf, embeddings, hybrid, no aplica]
    validations:
      required: true
