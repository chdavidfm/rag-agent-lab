name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Formato y lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar el proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Formato (ruff format)
        run: ruff format --check .

      - name: Lint (ruff)
        run: ruff check .

  tests:
    name: Tests · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar el proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tests (pytest)
        run: pytest

  docker:
    name: Imagen Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir la imagen
        run: docker build -t rag-agent-lab:ci .

      - name: Comprobar que el servicio responde
        run: |
          docker run -d --name rag -p 8000:8000 rag-agent-lab:ci
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && break
            sleep 2
          done
          curl -sf http://localhost:8000/health
          docker rm -f rag
