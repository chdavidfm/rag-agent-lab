name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar el paquete y sus dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm]"

      - name: Formato (ruff format)
        run: ruff format --check .

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest
