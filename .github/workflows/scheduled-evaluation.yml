name: Weekly evaluation

# Quality can degrade without the code changing: a new dependency alters the
# tokeniser, a model is updated upstream. This weekly run catches that and
# opens an issue automatically.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  evaluate:
    name: Measure retrieval quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Evaluate
        run: rag-eval --min-hit-rate 0.90 --min-mrr 0.80

      - name: Open an issue if quality dropped
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "Weekly evaluation fell below the quality thresholds",
              body: `The scheduled measurement did not meet its minimum thresholds.\n\n` +
                    `Full log: ${url}`,
              labels: ["quality"],
            });
