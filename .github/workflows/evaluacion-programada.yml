name: Evaluación semanal

# La calidad puede degradarse sin tocar el código: una dependencia nueva
# cambia el tokenizador, un modelo se actualiza. Esta ejecución semanal lo
# detecta y abre una incidencia automáticamente.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  evaluar:
    name: Medir la calidad de recuperación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar el proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Evaluar
        id: evaluar
        run: |
          echo "metricas=$(rag-eval --json)" >> "$GITHUB_OUTPUT"
          rag-eval --min-hit-rate 0.85 --min-mrr 0.75

      - name: Abrir incidencia si la calidad ha bajado
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "La evaluación semanal no alcanza los umbrales",
              body: `La medición programada ha quedado por debajo del mínimo.\n\n` +
                    `Registro completo: ${url}`,
              labels: ["calidad"],
            });
