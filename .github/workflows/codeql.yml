name: Security analysis

# CodeQL looks for real vulnerabilities in the code: injection, exposed
# secrets, unsafe paths. It runs on every change and once a week, because new
# rules land for code that has not changed.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  analyse:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@v4
