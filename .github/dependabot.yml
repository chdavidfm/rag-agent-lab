# Dependabot watches the dependencies and opens a pull request whenever a new
# version appears. CI decides whether the update is safe, so the project stays
# current without manual review.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One pull request for the development tooling instead of one each:
      # less noise, a single review.
      tooling:
        patterns: ["ruff", "mypy", "pytest*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "docker"
