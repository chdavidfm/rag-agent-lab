[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent-lab"
version = "0.5.0"
description = "A compact, transparent RAG stack: retrieve and answer over your own documents, fully local and without API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Mejía", email = "chdavidfm@gmail.com" }]
keywords = ["rag", "llm", "retrieval", "reranking", "semantic-search", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
embeddings = ["sentence-transformers>=2.6"]
llm = ["openai>=1.0"]
dev = [
    "rag-agent-lab[api,llm]",
    "pytest==8.4.2",
    "httpx>=0.27",
    "ruff==0.16.4",
    "mypy==1.20.2",
]

[project.scripts]
rag-agent = "rag_agent.cli:main"
rag-eval = "rag_agent.eval_cli:main"

[project.urls]
Repository = "https://github.com/chdavidfm/rag-agent-lab"
Changelog = "https://github.com/chdavidfm/rag-agent-lab/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["rag_agent"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q -m 'not integration'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: exercises real models or services; run with -m integration",
]

[tool.mypy]
# python_version is deliberately unset: mypy analyses with the interpreter
# running it. Pinning it to a different version leaves it unable to read the
# stubs of dependencies such as numpy, which target newer interpreters.
# Compatibility with 3.10 is guaranteed by the test matrix and by ruff.
files = ["rag_agent"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
