[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent-lab"
version = "0.1.0"
description = "Agente RAG mínimo y didáctico: recupera y responde sobre tus documentos, 100% en local y sin claves."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Mejía", email = "chdavidfm@gmail.com" }]
keywords = ["rag", "llm", "retrieval", "nlp", "tf-idf", "openai"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
]

[project.optional-dependencies]
llm = ["openai>=1.0"]
dev = ["pytest==8.3.4", "ruff==0.15.8"]

[project.scripts]
rag-agent = "rag_agent.cli:main"

[project.urls]
Repository = "https://github.com/chdavidfm/rag-agent-lab"

[tool.setuptools]
packages = ["rag_agent"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
