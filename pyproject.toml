[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent-lab"
version = "0.3.0"
description = "Agente RAG mínimo y didáctico: recupera y responde sobre tus documentos, 100% en local y sin claves."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Mejía", email = "chdavidfm@gmail.com" }]
keywords = ["rag", "llm", "retrieval", "nlp", "tf-idf", "fastapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.3",
    "numpy>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
embeddings = ["sentence-transformers>=2.6"]
llm = ["openai>=1.0"]
dev = [
    "rag-agent-lab[api,llm]",
    "pytest==8.3.4",
    "httpx>=0.27",
    "ruff==0.15.8",
    "mypy==1.14.1",
]

[project.scripts]
rag-agent = "rag_agent.cli:main"
rag-eval = "rag_agent.eval_cli:main"

[project.urls]
Repository = "https://github.com/chdavidfm/rag-agent-lab"

[tool.setuptools]
packages = ["rag_agent"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-q -m 'not integracion'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integracion: usa modelos o servicios reales; se ejecuta con -m integracion",
]

[tool.mypy]
python_version = "3.10"
files = ["rag_agent"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
